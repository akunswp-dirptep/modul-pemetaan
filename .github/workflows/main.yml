name: Installer Produksi

on:
  push:
    branches:
      - pemetaan-V6
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Ambil File dari Repository
      uses: actions/checkout@v4

    - name: Jalankan Inno Setup
      run: iscc github-export.iss

    - name: Buat GitHub Release di Repo Tujuan
      uses: softprops/action-gh-release@v2
      with:

        repository: Akring-creator/update-version-repo
        token: ${{ secrets.PAT_TOKEN }}
        tag_name: v6-${{ github.run_number }}-${{ github.run_id }}
        name: "Penilaian Tanah V6.14"
        body: |
          Automated release oleh GitHub Actions.
          Komit terakhir: ${{ github.sha }}
        
        files: Output/*
        
        prerelease: false
        draft: false
