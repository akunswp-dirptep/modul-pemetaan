name: Kompilasi Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Ambil File dari Repository
      uses: actions/checkout@v4

    - name: Jalankan Inno Setup
      uses: amake/innosetup-action@v1
      with:
        filepath: nama_file_skrip_anda.iss

    - name: Simpan Hasil Kompilasi (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: Hasil-Installer
        path: Output/
